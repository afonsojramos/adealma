name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: nub install

      # wrangler deploys the config the build generates, not wrangler.jsonc, so
      # the build has to run first for config changes to take effect.
      - run: nub run build

      - id: credentials
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.credentials.outputs.present != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, skipping deploy."

      - if: steps.credentials.outputs.present == 'true'
        run: nubx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
